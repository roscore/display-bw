[package]
name = "bw_web"
description = "Browser UI for display-bw (WebAssembly, web-sys)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bw_core = { path = "../bw_core" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement",
  "HtmlCanvasElement", "HtmlOptionElement", "HtmlTextAreaElement", "HtmlDetailsElement", "CanvasRenderingContext2d",
  "Node", "NodeList", "Event", "EventTarget", "History", "Location", "Navigator", "Storage",
  "Clipboard", "DomTokenList", "CssStyleDeclaration", "MediaQueryList", "TextMetrics",
]
